<style>

main{max-width:1240px;margin:auto;padding:26px 20px}.hero{display:grid;grid-template-columns:1.45fr .55fr;gap:16px;margin-bottom:20px}.card,.panel{border:1px solid #ffffff12;background:linear-gradient(150deg,#162642e8,#0d192ce8);border-radius:28px;box-shadow:var(--shadow)}.hero-main{padding:32px;position:relative;overflow:hidden}.hero-main:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-130px;background:radial-gradient(circle,#ff5fb744,transparent 70%)}.eyebrow{font-size:11px;color:var(--cyan);font-weight:950;letter-spacing:1.8px;text-transform:uppercase}h2{margin:10px 0 12px;font-size:clamp(34px,5vw,64px);line-height:.98;letter-spacing:-2.5px}h2 span{background:linear-gradient(90deg,var(--cyan),white,var(--pink));-webkit-background-clip:text;color:transparent}.hero p{max-width:720px;color:var(--muted);line-height:1.7}.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.actions{margin-top:18px}.stats{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:17px;border:1px solid var(--line);background:#ffffff08;border-radius:18px}.stat strong{display:block;font-size:30px}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px}.search,.select{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#0f1b30;color:white;outline:none}.search:focus,.select:focus{border-color:#57e8ff88;box-shadow:0 0 0 4px #57e8ff12}.chips{display:flex;gap:8px;overflow:auto;padding:13px 0 15px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#ffffff08;color:var(--muted);padding:9px 14px;border-radius:999px;font-size:12px;font-weight:850}.chip.on{color:#07111c;background:linear-gradient(90deg,var(--cyan),#baf6ff);border-color:transparent}.sectionbar{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:15px 2px 10px}.sectionbar h3{margin:0;font-size:20px}.muted{color:var(--muted);font-size:13px}
.song-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.song{border:1px solid var(--line);background:linear-gradient(155deg,#172845,#0d192d);border-radius:22px;padding:15px;transition:.2s transform,.2s border-color,.2s box-shadow}.song:hover{transform:translateY(-2px);border-color:#57e8ff66;box-shadow:0 18px 50px #0005}.song-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.appcode{font:950 14px ui-monospace,SFMono-Regular,monospace;color:var(--gold);background:#ffd16612;border:1px solid #ffd16644;border-radius:12px;padding:10px}.meta{min-width:0}.title{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:10px;font-weight:900;letter-spacing:.4px;padding:5px 8px;border-radius:999px;background:#57e8ff12;border:1px solid #57e8ff38;color:#9cf2ff}.badge.trend{background:#ff5fb714;border-color:#ff5fb744;color:#ff9ed2}.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.vendor{border:1px solid var(--line);background:#ffffff08;border-radius:13px;padding:10px}.vendor b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.vendor span{display:block;margin-top:4px;font:900 13px ui-monospace,monospace;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-actions{margin-top:12px;display:flex;gap:8px}.fav{border:1px solid var(--line);background:#ffffff08;color:var(--muted);border-radius:12px;padding:10px}.fav.on{color:var(--gold)}

dialog{width:min(560px,94vw);border:1px solid var(--line);border-radius:24px;padding:23px;background:#101d32;color:white;box-shadow:var(--shadow)}dialog::backdrop{background:#02050dcc;backdrop-filter:blur(8px)}.field{margin-top:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:#0a1527;color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:100;background:#162845;border:1px solid #57e8ff55;border-radius:15px;padding:12px 17px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:820px){.hero{grid-template-columns:1fr}.song-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.codes{grid-template-columns:repeat(2,1fr)}nav{width:calc(100% - 20px)}nav button{min-width:0;flex:1}.label{display:none}}
@media(max-width:480px){main{padding:20px 14px}.head{padding:12px 14px}.brand p{display:none}.hero-main{padding:24px}.song-top{grid-template-columns:auto 1fr}.song-top>.btn{grid-column:2}.codes{grid-template-columns:1fr 1fr}}
</style>

<script>

ini","Zack Tabudlo",2021,"love"],["13008","Pagsamo","Arthur Nery",2021,"love"],["13009","Buwan","Juan Karlos",2018,"love"],["13010","Mundo","IV of Spades",2018,"love"],["13011","Torete","Moonstar88",2001,"love"],["13012","Jopay","Mayonnaise",2004,"love"],["13013","214","Rivermaya",1996,"love"],["13014","Harana","Parokya ni Edgar",1997,"love"],["14001","Ang Huling El Bimbo","Eraserheads",1995,"rock"],["14002","Alapaap","Eraserheads",1995,"rock"],["14003","Magasin","Eraserheads",1994,"rock"],["14004","With a Smile","Eraserheads",1995,"rock"],["14005","Narda","Kamikazee",2006,"rock"],["14006","Huling Sayaw","Kamikazee ft. Kyla",2012,"rock"],["14007","Gitara","Parokya ni Edgar",2005,"rock"],["14008","Basang-Basa sa Ulan","Aegis",1998,"rock"],["15001","Ocho Ocho","Bayani Agbayani",2003,"party"],["15002","Spaghetti Song","Sexbomb Girls",2002,"party"],["15003","Itaktak Mo","Joey de Leon & Sexbomb Girls",2006,"party"],["15004","Pusong Bato","Alon",2013,"party"],["20001","My Way","Frank Sinatra",1969,"english"],["20002","Through the Fire","Chaka Khan",1984,"english"],["20003","I Will Always Love You","Whitney Houston",1992,"english"],["20004","Bohemian Rhapsody","Queen",1975,"english"],["20005","Don't Stop Believin'","Journey",1981,"english"],["20006","The Man Who Can't Be Moved","The Script",2008,"english"],["20007","Iris","Goo Goo Dolls",1998,"english"],["20008","I Want It That Way","Backstreet Boys",1999,"english"],["20009","Dancing Queen","ABBA",1976,"english"],["20010","Careless Whisper","George Michael",1984,"english"],["20011","My Heart Will Go On","Celine Dion",1997,"english"],["20012","Hotel California","Eagles",1976,"english"],["20013","Faithfully","Journey",1983,"english"],["20014","Perfect","Ed Sheeran",2017,"english"],["20015","A Thousand Years","Christina Perri",2011,"english"]];
const VERIFIED={"12001":{"platinum":{"code":"1426","model":"Platinum P-Series Vol. 59 (legacy)"}},"14001":{"platinum":{"code":"3057","model":"Platinum P-Series Vol. 59 (legacy)"}},"20005":{"platinum":{"code":"8267","model":"Platinum P-Series Vol. 59 (legacy)"}},"20015":{"platinum":{"code":"11703","model":"Platinum P-Series Vol. 59 (legacy)"}}};
const BRANDS={magic:"Magic Sing",platinum:"Platinum",tj:"TJ Media",kumyoung:"Kumyoung",wow:"WOW Fiesta",grand:"Grand Videoke"};
const CATS={all:"All songs",hits:"🔥 Trending",originals:"🎼 AJ Originals",ppop:"💜 P-Pop",classic:"🎙 OPM classics",love:"💘 Love songs",rock:"🎸 Band & rock",party:"🎉 Party",english:"🌍 English",fav:"⭐ Favorites"};
const SONGS=RAW.map((s,i)=>({code:s[0],ukc:`UKC-PH-${s[0]}`,title:s[1],artist:s[2],year:s[3],cat:s[4],trend:100-i}));
const KEY="videokeph.unified.v1", $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state={queue:[],favs:[],coins:0,codes:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{}
state.queue=Array.isArray(state.queue)?state.queue:[];state.favs=Array.isArray(state.favs)?state.favs:[];state.codes={...VERIFIED,...(state.codes||{})};
let tab="book",filter="all",query="",sort="title",pending=null,editing=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),2200)}
function vendorData(s,b){return state.codes[s.code]?.[b]||null}function hasCodes(s){return Object.keys(state.codes[s.code]||{}).length>0}
function searchable(s){return[s.title,s.artist,s.code,s.ukc,...Object.keys(BRANDS).flatMap(b=>{const v=vendorData(s,b);return[v?.code,v?.model]})].filter(Boolean).join(" ").toLowerCase()}
function baseCompare(a,b){return sort==="year"?b.year-a.year:sort==="trending"?b.trend-a.trend:a.title.localeCompare(b.title)}
function smartCompare(a,b){if(filter==="all"){const at=a.cat==="hits",bt=b.cat==="hits";if(at!==bt)return at?-1:1;if(!at&&!bt){const ac=hasCodes(a),bc=hasCodes(b);if(ac!==bc)return ac?-1:1}}return baseCompare(a,b)}
function hero(){return`<section class="hero"><div class="card hero-main"><div class="eyebrow">The Philippines' premium digital songbook</div><h2>Find the song. <span>Own the moment.</span></h2><p>Search curated OPM, international favorites, and original music by AJ Miller T. Perez. Verified machine codes appear only when the exact catalog match is known.</p><div class="actions"><button class="btn pink" data-jump="hits">Explore trending</button><button class="btn ghost" data-random>🎲 Surprise me</button><button class="btn ghost" data-jump="originals">♫ AJ Originals</button></div></div><div class="card stats"><div class="stat"><strong>${SONGS.length}</strong><span>curated songs</span></div><div class="stat"><strong>${SONGS.filter(hasCodes).length}</strong><span>songs with codes</span></div><div class="stat"><strong>${state.favs.length}</strong><span>favorites</span></div><div class="stat"><strong>${state.queue.length}</strong><span>queued</span></div></div></section>`}
function songRow(s){const vendors=Object.entries(BRANDS).flatMap(([k,n])=>{const v=vendorData(s,k);return v?[`<div class="vendor" title="${esc(v.model)}"><b>${n}</b><span>${esc(v.code)}</span></div>`]:[]}).join("");return`<article class="song"><div class="song-top"><div class="appcode">${s.code}</div><div class="meta"><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)} · ${s.year} · ${s.ukc}</div><div class="badges">${s.cat==="hits"?'<span class="badge trend">Trending</span>':""}${hasCodes(s)?'<span class="badge">Verified code</span>':""}</div></div><button class="btn pink" data-res="${s.code}">Queue</button></div>${vendors?`<div class="codes">${vendors}</div>`:""}<div class="song-actions"><button class="fav ${state.favs.includes(s.code)?"on":""}" data-fav="${s.code}">★ Favorite</button><button class="btn ghost" data-edit="${s.code}">＋ Machine code</button></div></article>`}
function book(){let list=SONGS.filter(s=>{if(filter==="fav"&&!state.favs.includes(s.code))return false;if(!["all","fav"].includes(filter)&&s.cat!==filter)return false;const q=query.trim().toLowerCase();return!q||searchable(s).includes(q)});list.sort(smartCompare);return hero()+`<div class="toolbar"><input id="search" class="search" placeholder="Search title, artist, UKC, or machine code" value="${esc(query)}"><select id="sort" class="select"><option value="title" ${sort==="title"?"selected":""}>Sort rest: Title</option><option value="year" ${sort==="year"?"selected":""}>Sort rest: Newest</option><option value="trending" ${sort==="trending"?"selected":""}>Sort rest: Popularity</option></select><button class="btn ghost" data-clear>Clear</button></div><div class="chips">${Object.entries(CATS).map(([k,v])=>`<button class="chip ${filter===k?"on":""}" data-cat="${k}">${v}</button>`).join("")}</div><div class="sectionbar"><div><h3>${CATS[filter]}</h3><span class="muted">${list.length} result${list.length===1?"":"s"}</span></div><span class="muted">${filter==="all"?"Trending first · coded songs next · then the rest":"Only verified machine codes are shown"}</span></div><div class="song-grid">${list.map(songRow).join("")||'<div class="empty">No songs found.</div>'}</div>`}
function queueView(){if(!state.queue.length)return`<div class="sectionbar"><div><div class="eyebrow">Party flow</div><h3>Singing queue</h3></div></div><div class="empty">No songs queued yet.</div>`;return`<div class="panel"><div class="eyebrow">Party flow</div><h3>Singing queue</h3>${state.queue.map((x,i)=>`<div class="qitem"><strong>${i+1}</strong><div class="meta"><div class="title">${esc(x.title)}</div><div class="artist">${esc(x.artist)}${x.singer?" · 🎙 "+esc(x.singer):""} · ${x.ukc}</div></div><button class="btn ghost" data-del="${i}">Remove</button></div>`).join("")}<div class="row" style="margin-top:15px"><button class="btn ghost" data-clearq>Clear queue</button></div></div>`}
function guide(){return`<div class="panel"><div class="eyebrow">Code guide</div><h3>One clean cross-reference</h3><p class="muted">Every song has a VideokePH code and UKC ID. Brand cards appear only when an exact machine or songbook match is saved.</p><div class="codes" style="margin-top:18px">${Object.entries(BRANDS).map(([k,v])=>`<div class="vendor"><b>${v}</b><span>${k==="magic"?"E-series":k==="platinum"?"Piano 4K / verified legacy":k==="tj"?"Current catalog":k==="kumyoung"?"Current PH catalog":k==="wow"?"Current Fiesta catalog":"Symphony 3 Pro Plus"}</span></div>`).join("")}</div></div>`}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));$("qBadge").textContent=state.queue.length?`(${state.queue.length})`:"";$("coins").textContent=state.coins;$("main").innerHTML=tab==="book"?book():tab==="queue"?queueView():guide();wire()}
function wire(){const r=$("main");r.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});r.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{filter=b.dataset.jump;render();setTimeout(()=>document.querySelector(".toolbar")?.scrollIntoView({behavior:"smooth"}),0)});r.querySelector("[data-random]")?.addEventListener("click",()=>{const s=SONGS[Math.floor(Math.random()*SONGS.length)];pending=s.code;$("qTitle").textContent=`Reserve ${s.title}`;$("singer").value="";$("queueDlg").showModal()});const q=$("search");if(q)q.oninput=()=>{query=q.value;render();$("search")?.focus()};$("sort")?.addEventListener("change",e=>{sort=e.target.value;render()});r.querySelector("[data-clear]")?.addEventListener("click",()=>{query="";render()});r.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const c=b.dataset.fav,i=state.favs.indexOf(c);i>=0?state.favs.splice(i,1):state.favs.push(c);save();render()});r.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{pending=b.dataset.res;const s=SONGS.find(x=>x.code===pending);$("qTitle").textContent=`Reserve ${s.title}`;$("singer").value="";$("queueDlg").showModal()});r.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editing=b.dataset.edit;const s=SONGS.find(x=>x.code===editing);$("cTitle").textContent=`Machine code · ${s.title}`;$("cCode").value="";$("cModel").value="";$("codeDlg").showModal()});r.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.queue.splice(+b.dataset.del,1);save();render()});r.querySelector("[data-clearq]")?.addEventListener("click",()=>{state.queue=[];save();render()})}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});$("qCancel").onclick=()=>$("queueDlg").close();$("qAdd").onclick=()=>{const s=SONGS.find(x=>x.code===pending);if(!s)return;state.queue.push({...s,singer:$("singer").value.trim()});save();$("queueDlg").close();toast(`Queued: ${s.title}`);render()};$("cCancel").onclick=()=>$("codeDlg").close();$("cSave").onclick=()=>{const code=$("cCode").value.trim(),model=$("cModel").value.trim(),brand=$("cBrand").value;if(!code||!model)return toast("Enter both code and exact model.");state.codes[editing]??={};state.codes[editing][brand]={code,model};save();$("codeDlg").close();toast(`${BRANDS[brand]} code saved`);render()};$("sunoBtn").onclick=()=>window.open("https://suno.com/@millertperez","_blank","noopener");$("coinBtn").onclick=()=>{state.coins++;save();$("coins").textContent=state.coins;toast("Coin inserted — singing is still free!")};if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});render();
</script>
