function queue(){const now=S.queue[0];let h=`<div class="sectionbar"><div><div class="eyebrow">Party flow</div><h3>Singing queue</h3></div><span class="muted">${S.queue.length} reserved</span></div>`;if(!now)return h+`<div class="empty">The queue is empty. Add a song from the songbook.</div>`;h+=`<div class="now"><div class="label">NOW PLAYING</div><div class="title">${esc(now.title)}</div><div class="artist">${esc(now.artist)}${now.singer?` · 🎙 ${esc(now.singer)}`:""}</div><div class="row" style="margin-top:14px"><button class="btn pink" data-sing>Start performance</button><button class="btn ghost" data-yt="${now.code}">YouTube karaoke</button><button class="btn ghost" data-skip>Skip</button></div></div><div class="sectionbar"><h3>Up next</h3></div>`;h+=S.queue.slice(1).map((x,i)=>`<div class="qitem"><div class="n">${i+1}</div><div class="meta"><div class="title">${esc(x.title)}</div><div class="artist">${esc(x.artist)}${x.singer?` · 🎙 ${esc(x.singer)}`:""}</div></div><button class="mini" data-up="${i+1}">↑</button><button class="mini" data-del="${i+1}">✕</button></div>`).join("")||`<div class="muted" style="padding:14px">No one else is in line.</div>`;return h+`<div class="row" style="margin-top:14px"><button class="btn warn" data-clearq>Clear queue</button></div>`}
function charts(){if(!S.history.length)return`<div class="sectionbar"><div><div class="eyebrow">Hall of fame</div><h3>Performance charts</h3></div></div><div class="empty">No performances yet.</div>`;const best={};S.history.forEach(p=>{const k=p.singer||"Anonymous";if(!best[k]||p.score>best[k].score)best[k]=p});const top=Object.entries(best).sort((a,b)=>b[1].score-a[1].score).slice(0,10);return`<div class="panel"><div class="eyebrow">Hall of fame</div><h2>Top singers</h2><table><tr><th>Rank</th><th>Singer</th><th>Best song</th><th>Score</th></tr>${top.map(([n,p],i)=>`<tr><td>${["🥇","🥈","🥉"][i]||i+1}</td><td><strong>${esc(n)}</strong></td><td>${esc(p.title)}</td><td class="score">${p.score}</td></tr>`).join("")}</table><div class="row" style="margin-top:14px"><button class="btn ghost" data-export>Export</button><button class="btn warn" data-reset>Reset</button></div></div>`}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));$("qBadge").textContent=S.queue.length?`(${S.queue.length})`:"";$("coinCt").textContent=S.coins;$("main").innerHTML=tab==="book"?book():tab==="remote"?remote():tab==="queue"?queue():charts();wire()}
function reserve(code){const s=byCode[code];if(!s)return;pending=code;$("rdTitle").textContent=s.title;$("rdSinger").value="";$("rdRecent").innerHTML=S.singers.slice(0,6).map(n=>`<button class="chip" data-quick="${esc(n)}">${esc(n)}</button>`).join("");$("rdRecent").querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>$("rdSinger").value=b.dataset.quick);$("reserveDlg").showModal()}
function addQueue(){const s=byCode[pending],singer=$("rdSinger").value.trim();if(!s)return;if(singer&&!S.singers.includes(singer)){S.singers.unshift(singer);S.singers=S.singers.slice(0,12)}S.queue.push({code:s.code,title:s.title,artist:s.artist,singer});S.requests[s.code]=(S.requests[s.code]||0)+1;save();$("reserveDlg").close();padCode="";toast(`Queued: ${s.title}`);render()}
function start(){const n=S.queue[0];if(!n)return;$("pvTitle").textContent=n.title;$("pvArtist").textContent=n.artist;$("pvSinger").textContent=n.singer?`🎙 ${n.singer}`:"";$("pvTimer").textContent="0:00";$("pvMeter").style.width="0";$("perfOv").classList.add("open");perf={t0:Date.now(),frames:0,active:0,stream:null,raf:0,iv:setInterval(()=>{const s=Math.floor((Date.now()-perf.t0)/1000);$("pvTimer").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},500)};navigator.mediaDevices?.getUserMedia({audio:true}).then(stream=>{if(!perf)return;perf.stream=stream;const c=new AudioContext(),src=c.createMediaStreamSource(stream),an=c.createAnalyser();an.fftSize=256;src.connect(an);perf.an=an;$("pvMicNote").textContent="Mic active — sing clearly for a stronger activity score.";const buf=new Uint8Array(an.fftSize);const loop=()=>{if(!perf?.an)return;an.getByteTimeDomainData(buf);let sum=0;for(const x of buf){const v=(x-128)/128;sum+=v*v}const rms=Math.sqrt(sum/buf.length);perf.frames++;if(rms>.035)perf.active++;$("pvMeter").style.width=Math.min(100,rms*760)+"%";perf.raf=requestAnimationFrame(loop)};loop()}).catch(()=>$("pvMicNote").textContent="Mic unavailable — fun scoring will be used.")}
function finish(cancel){if(!perf)return;clearInterval(perf.iv);cancelAnimationFrame(perf.raf);perf.stream?.getTracks().forEach(t=>t.stop());$("perfOv").classList.remove("open");const n=S.queue[0];if(cancel||!n){perf=null;render();return}const secs=(Date.now()-perf.t0)/1000;let score=perf.an&&perf.frames>20?Math.round(76+(perf.active/perf.frames)*22+Math.random()*4):Math.round(82+Math.random()*17);if(secs<8)score=Math.min(score,74);score=Math.max(60,Math.min(100,score));const rec={...n,score,at:Date.now()};S.history.push(rec);S.queue.shift();save();perf=null;$("scNum").textContent=score;$("scVerdict").textContent=score>=95?"🌟 Superstar!":score>=90?"🔥 Encore!":score>=85?"👏 Ang galing!":score>=80?"😊 Solid performance!":"🎶 Keep singing!";$("scWho").textContent=(rec.singer?rec.singer+" · ":"")+rec.title;$("scoreOv").classList.add("open");render()}
function wire(){const r=$("main");r.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});r.querySelector("[data-jump]")?.addEventListener("click",e=>{filter=e.currentTarget.dataset.jump;render();setTimeout(()=>document.querySelector(".toolbar")?.scrollIntoView({behavior:"smooth"}),0)});r.querySelector("[data-random]")?.addEventListener("click",()=>reserve(SONGS[Math.floor(Math.random()*SONGS.length)].code));r.querySelector("[data-suno]")?.addEventListener("click",()=>window.open("https://suno.com/@millertperez","_blank","noopener"));const q=$("search");if(q)q.oninput=()=>{query=q.value;render();$("search").focus()};$("sort")?.addEventListener("change",e=>{sort=e.target.value;render()});r.querySelector("[data-clear]")?.addEventListener("click",()=>{query="";render()});r.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>reserve(b.dataset.res));r.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const c=b.dataset.fav,i=S.favs.indexOf(c);i>=0?S.favs.splice(i,1):S.favs.push(c);save();render()});r.querySelectorAll("[data-pad]").forEach(b=>b.onclick=()=>{if(padCode.length<5)padCode+=b.dataset.pad;render()});r.querySelector("[data-clr]")?.addEventListener("click",()=>{padCode="";render()});r.querySelector("[data-ok]")?.addEventListener("click",()=>byCode[padCode]?reserve(padCode):toast("Code not found"));r.querySelector("[data-sing]")?.addEventListener("click",start);r.querySelectorAll("[data-yt]").forEach(b=>b.onclick=()=>window.open(yt(byCode[b.dataset.yt]),"_blank","noopener"));r.querySelector("[data-skip]")?.addEventListener("click",()=>{S.queue.shift();save();render()});r.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[S.queue[i],S.queue[i-1]]=[S.queue[i-1],S.queue[i]];save();render()}});r.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.queue.splice(+b.dataset.del,1);save();render()});r.querySelector("[data-clearq]")?.addEventListener("click",()=>{if(confirm("Clear the queue?")){S.queue=[];save();render()}});r.querySelector("[data-export]")?.addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="videokeph-data.json";a.click()});r.querySelector("[data-reset]")?.addEventListener("click",()=>{if(confirm("Reset favorites, queue, and scores?")){S=normalize({});save();render()}})}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});$("rdCancel").onclick=()=>$("reserveDlg").close();$("rdOk").onclick=addQueue;$("pvStop").onclick=()=>finish(false);$("pvCancel").onclick=()=>finish(true);$("pvYt").onclick=()=>S.queue[0]&&window.open(yt(S.queue[0]),"_blank","noopener");$("scNext").onclick=()=>{$("scoreOv").classList.remove("open");tab="queue";render()};$("scClose").onclick=()=>$("scoreOv").classList.remove("open");$("coinBtn").onclick=()=>{S.coins++;save();$("coinCt").textContent=S.coins;toast("Coin inserted — singing is still free!")};$("tvBtn").onclick=()=>{tv=!tv;document.body.classList.toggle("tv",tv);$("tvBtn").innerHTML=tv?"↙ Exit TV":"📺 <span class='label'>TV mode</span>"};$("partyBtn").onclick=()=>toast("✨ Party mode activated!");if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});render();
</script>
