<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b19">
<meta name="description" content="VideokePH songbook with VideokePH IDs and model-aware Magic Sing, Platinum, TJ Media, Kumyoung, WOW Fiesta, and Grand Videoke code fields.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>VideokePH — Multi-brand Songbook</title>
<style>
:root{--bg:#070a17;--panel:#111936;--panel2:#172246;--line:#2b3866;--text:#f7f8ff;--muted:#aab4d5;--cyan:#58e6ff;--pink:#ff53c5;--gold:#ffd36a;--green:#5bf1a4;--red:#ff7f91}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(900px 520px at 0 -10%,#163c64,transparent 62%),radial-gradient(800px 520px at 100% 0,#491747,transparent 60%),linear-gradient(180deg,#0d1330,var(--bg));padding-bottom:92px}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:30;background:#070a17dc;backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.head{max-width:1220px;margin:auto;padding:13px 18px;display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--pink));font-size:23px}.brand h1{font-size:20px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0;letter-spacing:1.2px;text-transform:uppercase}.head-actions{margin-left:auto;display:flex;gap:8px}.btn,.icon{border:0;border-radius:13px;padding:11px 15px;font-weight:850}.btn{color:#07111c;background:linear-gradient(90deg,var(--cyan),#b7f5ff)}.btn.pink{color:white;background:linear-gradient(90deg,var(--pink),#ff82d9)}.btn.ghost,.icon{color:var(--text);background:#ffffff0d;border:1px solid var(--line)}main{max-width:1220px;margin:auto;padding:22px 18px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:16px;margin-bottom:18px}.card{border:1px solid var(--line);background:linear-gradient(160deg,#19264ddd,#0d152ddd);border-radius:26px;box-shadow:0 22px 70px #0005}.hero-main{padding:28px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase}.hero h2{font-size:clamp(34px,5vw,62px);line-height:1;letter-spacing:-2px;margin:10px 0 12px}.hero h2 span{background:linear-gradient(90deg,var(--cyan),white,var(--pink));-webkit-background-clip:text;color:transparent}.hero p{max-width:720px;color:var(--muted);line-height:1.65}.notice{margin-top:16px;padding:12px 14px;border:1px solid #ffd36a55;background:#ffd36a10;border-radius:15px;color:#ffe5a2;font-size:13px;line-height:1.5}.stats{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border:1px solid var(--line);background:#ffffff0a;border-radius:17px}.stat strong{display:block;font-size:28px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px}.search,.select{width:100%;padding:13px 15px;border-radius:15px;border:1px solid var(--line);background:#111a38;color:white;outline:none}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 14px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#ffffff0b;color:var(--muted);padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800}.chip.on{color:#07111c;background:linear-gradient(90deg,var(--cyan),#b7f5ff);border-color:transparent}.sectionbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:13px 2px 10px}.sectionbar h3{margin:0}.muted{color:var(--muted);font-size:13px}.song-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.song{border:1px solid var(--line);background:linear-gradient(160deg,#182448,#0e162f);border-radius:20px;padding:14px}.song-top{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}.appcode{font:900 14px ui-monospace,monospace;color:var(--gold);background:#ffd36a12;border:1px solid #ffd36a44;border-radius:11px;padding:9px}.meta{min-width:0}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;gap:7px;flex-wrap:wrap}.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.vendor{border:1px solid var(--line);background:#ffffff08;border-radius:12px;padding:9px}.vendor b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.vendor span{display:block;margin-top:4px;font:850 12px ui-monospace,monospace;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vendor .none{font-family:inherit;color:#7d88aa;font-weight:700}.song-actions{margin-top:11px;display:flex;gap:7px}.fav{border:1px solid var(--line);background:#ffffff0b;color:var(--muted);border-radius:11px;padding:9px}.fav.on{color:var(--gold)}nav{position:fixed;z-index:40;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#0b1022e8;border:1px solid var(--line);backdrop-filter:blur(20px);border-radius:19px}nav button{min-width:108px;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:13px;font-size:12px;font-weight:850}nav button.on{color:#07111c;background:linear-gradient(90deg,var(--cyan),#b7f5ff)}.panel{border:1px solid var(--line);background:linear-gradient(160deg,#19264d,#0d152d);border-radius:24px;padding:22px}.qitem{display:flex;align-items:center;gap:10px;padding:12px;margin-top:8px;border:1px solid var(--line);background:#ffffff09;border-radius:15px}.qitem .meta{flex:1}.empty{text-align:center;color:var(--muted);padding:48px 18px;border:1px dashed var(--line);border-radius:20px}dialog{width:min(560px,94vw);border:1px solid var(--line);border-radius:24px;padding:22px;background:#111a38;color:white}dialog::backdrop{background:#02040ccc;backdrop-filter:blur(7px)}.field{margin-top:11px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#0c1430;color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:11px;color:var(--muted);line-height:1.45}.toast{position:fixed;left:50%;bottom:103px;transform:translateX(-50%);z-index:100;background:#17224b;border:1px solid #58e6ff55;border-radius:14px;padding:11px 16px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:800px){.hero{grid-template-columns:1fr}.song-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.codes{grid-template-columns:repeat(2,1fr)}nav{width:calc(100% - 20px)}nav button{min-width:0;flex:1}.label{display:none}}@media(max-width:470px){.brand p{display:none}.hero-main{padding:22px}.codes{grid-template-columns:1fr 1fr}.song-top{grid-template-columns:auto 1fr}.song-top>.btn{grid-column:2}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">🎤</div><div class="brand"><h1>VideokePH</h1><p>Six-brand karaoke code directory</p></div><div class="head-actions"><button class="icon" id="sunoBtn">♫ <span class="label">Suno</span></button><button class="icon" id="coinBtn">🪙 <span id="coins">0</span></button></div></div></header>
<main id="main"></main>
<nav><button data-tab="book" class="on">📖 Songbook</button><button data-tab="queue">🎤 Queue <span id="qBadge"></span></button><button data-tab="codes">🔢 Code Guide</button></nav>
<dialog id="queueDlg"><h2 id="qTitle">Reserve song</h2><div class="field"><label>Singer name</label><input id="singer" maxlength="30" placeholder="Optional"></div><div class="row" style="justify-content:flex-end;margin-top:15px"><button class="btn ghost" id="qCancel">Cancel</button><button class="btn pink" id="qAdd">Add to queue</button></div></dialog>
<dialog id="codeDlg"><h2 id="cTitle">Add a machine code</h2><p class="small">Save a code for the exact karaoke player or songbook you checked. Local overrides stay in this browser.</p><div class="grid2"><div class="field"><label>Brand</label><select id="cBrand"><option value="magic">Magic Sing</option><option value="platinum">Platinum</option><option value="tj">TJ Media</option><option value="kumyoung">Kumyoung</option><option value="wow">WOW Fiesta</option><option value="grand">Grand Videoke</option></select></div><div class="field"><label>Song code</label><input id="cCode" placeholder="e.g. 12345" maxlength="20"></div></div><div class="field"><label>Player model / songbook version</label><input id="cModel" placeholder="e.g. Piano 4K 128GB, Symphony 3 Pro Plus"></div><div class="row" style="justify-content:flex-end;margin-top:15px"><button class="btn ghost" id="cCancel">Cancel</button><button class="btn" id="cSave">Save verified code</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
"use strict";
const RAW=[
["30001","Meow-Meow Twirl","AJ Miller T. Perez",2026,"originals"],["30002","Vietnamy Smiley","AJ Miller T. Perez",2026,"originals"],["30003","Breathe With the Light","AJ Miller T. Perez",2026,"originals"],["30004","The Road that Remembers","AJ Miller T. Perez",2026,"originals"],["30005","The Weather Verses","AJ Miller T. Perez",2026,"originals"],["30006","The Song of Righteousness","AJ Miller T. Perez",2026,"originals"],["30007","The Wind Verses of Batanes","AJ Miller T. Perez",2026,"originals"],["30008","Movement","AJ Miller T. Perez",2026,"originals"],
["10001","Palagi","TJ Monterde",2024,"hits"],["10002","Multo","Cup of Joe",2025,"hits"],["10003","Sining","Dionela ft. Jay R",2024,"hits"],["10004","Dilaw","Maki",2023,"hits"],["10005","Marilag","Dionela",2024,"hits"],["10006","Tibok","Earl Agustin",2025,"hits"],["10007","Raining in Manila","Lola Amour",2023,"hits"],["10008","ERE","Juan Karlos",2023,"hits"],["10009","Pasilyo","SunKissed Lola",2022,"hits"],["10010","Uhaw","Dilaw",2023,"hits"],
["11001","Gento","SB19",2023,"ppop"],["11002","Mapa","SB19",2021,"ppop"],["11003","Pantropiko","BINI",2023,"ppop"],["11004","Salamin, Salamin","BINI",2024,"ppop"],["11005","Karera","BINI",2023,"ppop"],
["12001","Anak","Freddie Aguilar",1978,"classic"],["12002","Maging Sino Ka Man","Rey Valera",1982,"classic"],["12003","Kahit Maputi Na ang Buhok Ko","Rey Valera",1980,"classic"],["12004","Kung Ako Na Lang Sana","Bituin Escalante",2003,"classic"],["12005","Kung Sakali","Michael Pangilinan",2014,"classic"],["12006","Bakit Pa?","Jessa Zaragoza",1997,"classic"],["12007","Hanggang","Wency Cornejo",1997,"classic"],["12008","Rainbow","South Border",2003,"classic"],
["13001","Tadhana","Up Dharma Down",2012,"love"],["13002","Kathang Isip","Ben&Ben",2017,"love"],["13003","Maybe the Night","Ben&Ben",2018,"love"],["13004","Pagtingin","Ben&Ben",2019,"love"],["13005","Sa Ngalan ng Pag-Ibig","December Avenue",2016,"love"],["13006","Tagpuan","Moira Dela Torre",2018,"love"],["13007","Binibini","Zack Tabudlo",2021,"love"],["13008","Pagsamo","Arthur Nery",2021,"love"],["13009","Buwan","Juan Karlos",2018,"love"],["13010","Mundo","IV of Spades",2018,"love"],["13011","Torete","Moonstar88",2001,"love"],["13012","Jopay","Mayonnaise",2004,"love"],["13013","214","Rivermaya",1996,"love"],["13014","Harana","Parokya ni Edgar",1997,"love"],
["14001","Ang Huling El Bimbo","Eraserheads",1995,"rock"],["14002","Alapaap","Eraserheads",1995,"rock"],["14003","Magasin","Eraserheads",1994,"rock"],["14004","With a Smile","Eraserheads",1995,"rock"],["14005","Narda","Kamikazee",2006,"rock"],["14006","Huling Sayaw","Kamikazee ft. Kyla",2012,"rock"],["14007","Gitara","Parokya ni Edgar",2005,"rock"],["14008","Basang-Basa sa Ulan","Aegis",1998,"rock"],
["15001","Ocho Ocho","Bayani Agbayani",2003,"party"],["15002","Spaghetti Song","Sexbomb Girls",2002,"party"],["15003","Itaktak Mo","Joey de Leon & Sexbomb Girls",2006,"party"],["15004","Pusong Bato","Alon",2013,"party"],
["20001","My Way","Frank Sinatra",1969,"english"],["20002","Through the Fire","Chaka Khan",1984,"english"],["20003","I Will Always Love You","Whitney Houston",1992,"english"],["20004","Bohemian Rhapsody","Queen",1975,"english"],["20005","Don't Stop Believin'","Journey",1981,"english"],["20006","The Man Who Can't Be Moved","The Script",2008,"english"],["20007","Iris","Goo Goo Dolls",1998,"english"],["20008","I Want It That Way","Backstreet Boys",1999,"english"],["20009","Dancing Queen","ABBA",1976,"english"],["20010","Careless Whisper","George Michael",1984,"english"],["20011","My Heart Will Go On","Celine Dion",1997,"english"],["20012","Hotel California","Eagles",1976,"english"],["20013","Faithfully","Journey",1983,"english"],["20014","Perfect","Ed Sheeran",2017,"english"],["20015","A Thousand Years","Christina Perri",2011,"english"]];
const BRANDS={magic:"Magic Sing",platinum:"Platinum",tj:"TJ Media",kumyoung:"Kumyoung",wow:"WOW Fiesta",grand:"Grand Videoke"};
const CATS={all:"All songs",hits:"🔥 Trending",originals:"🎼 AJ Originals",ppop:"💜 P-Pop",classic:"🎙 OPM classics",love:"💘 Love songs",rock:"🎸 Band & rock",party:"🎉 Party",english:"🌍 English",fav:"⭐ Favorites"};
const SONGS=RAW.map((s,i)=>({code:s[0],ukc:`UKC-PH-${s[0]}`,title:s[1],artist:s[2],year:s[3],cat:s[4],trend:100-i}));
const KEY="videokeph.multibrand.v1";const $=id=>document.getElementById(id);const esc=x=>String(x??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state={queue:[],favs:[],coins:0,codes:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{}state.queue=Array.isArray(state.queue)?state.queue:[];state.favs=Array.isArray(state.favs)?state.favs:[];state.codes=state.codes&&typeof state.codes==="object"?state.codes:{};
let tab="book",filter="all",query="",sort="trending",pending=null,editing=null;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),2200)}
function vendorData(s,b){return state.codes[s.code]?.[b]||null}function codeText(s,b){const v=vendorData(s,b);return v?.code||"Not verified"}function searchable(s){return[s.title,s.artist,s.code,s.ukc,...Object.keys(BRANDS).flatMap(b=>{const v=vendorData(s,b);return[v?.code,v?.model]})].filter(Boolean).join(" ").toLowerCase()}
function hero(){return`<section class="hero"><div class="card hero-main"><div class="eyebrow">Multi-brand karaoke directory</div><h2>One songbook. <span>Six machine systems.</span></h2><p>Search songs using a VideokePH ID, Universal Karaoke ID, or a saved vendor-specific code for Magic Sing, Platinum, TJ Media, Kumyoung, WOW Fiesta, and Grand Videoke.</p><div class="notice"><strong>Important:</strong> Vendor numbers can change by player model, region, song volume, and update version. “Not verified” means no exact model-specific match has been saved yet.</div></div><div class="card stats"><div class="stat"><strong>${SONGS.length}</strong><span>songs</span></div><div class="stat"><strong>6</strong><span>karaoke brands</span></div><div class="stat"><strong>${Object.values(state.codes).reduce((n,x)=>n+Object.keys(x||{}).length,0)}</strong><span>saved vendor codes</span></div><div class="stat"><strong>${state.queue.length}</strong><span>queued</span></div></div></section>`}
function songRow(s){const vendors=Object.entries(BRANDS).map(([k,n])=>{const v=vendorData(s,k);return`<div class="vendor" title="${esc(v?.model||"No exact player model recorded")}"><b>${n}</b><span class="${v?'':'none'}">${esc(codeText(s,k))}</span></div>`}).join("");return`<article class="song"><div class="song-top"><div class="appcode">${s.code}</div><div class="meta"><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)} · ${s.year} · ${s.ukc}</div></div><button class="btn pink" data-res="${s.code}">Queue</button></div><div class="codes">${vendors}</div><div class="song-actions"><button class="fav ${state.favs.includes(s.code)?'on':''}" data-fav="${s.code}">★ Favorite</button><button class="btn ghost" data-edit="${s.code}">＋ Add / update machine code</button></div></article>`}
function book(){let list=SONGS.filter(s=>{if(filter==="fav"&&!state.favs.includes(s.code))return false;if(!["all","fav"].includes(filter)&&s.cat!==filter)return false;const q=query.trim().toLowerCase();return!q||searchable(s).includes(q)});list.sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):sort==="year"?b.year-a.year:b.trend-a.trend);return hero()+`<div class="toolbar"><input id="search" class="search" placeholder="Search title, artist, UKC, Magic Sing, Platinum, TJ, Kumyoung, WOW, or Grand code" value="${esc(query)}"><select id="sort" class="select"><option value="trending">Sort: Trending</option><option value="title" ${sort==='title'?'selected':''}>Sort: Title</option><option value="year" ${sort==='year'?'selected':''}>Sort: Newest</option></select><button class="btn ghost" data-clear>Clear</button></div><div class="chips">${Object.entries(CATS).map(([k,v])=>`<button class="chip ${filter===k?'on':''}" data-cat="${k}">${v}</button>`).join("")}</div><div class="sectionbar"><div><h3>${CATS[filter]}</h3><span class="muted">${list.length} result${list.length===1?'':'s'}</span></div><span class="muted">UKC is VideokePH's stable cross-reference ID.</span></div><div class="song-grid">${list.map(songRow).join("")||'<div class="empty">No songs found.</div>'}</div>`}
function queueView(){if(!state.queue.length)return`<div class="sectionbar"><div><div class="eyebrow">Party flow</div><h3>Singing queue</h3></div></div><div class="empty">No songs queued yet.</div>`;return`<div class="panel"><div class="eyebrow">Party flow</div><h2>Singing queue</h2>${state.queue.map((x,i)=>`<div class="qitem"><strong>${i+1}</strong><div class="meta"><div class="title">${esc(x.title)}</div><div class="artist">${esc(x.artist)}${x.singer?' · 🎙 '+esc(x.singer):''} · ${x.ukc}</div></div><button class="btn ghost" data-del="${i}">Remove</button></div>`).join("")}<div class="row" style="margin-top:14px"><button class="btn ghost" data-clearq>Clear queue</button></div></div>`}
function guide(){return`<div class="panel"><div class="eyebrow">Code guide</div><h2>How the code directory works</h2><p class="muted">Each song has a five-digit VideokePH ID and a stable Universal Karaoke ID (UKC). Vendor fields are separate because machine manufacturers do not share one global numbering system.</p><div class="codes" style="margin-top:18px">${Object.entries(BRANDS).map(([k,v])=>`<div class="vendor"><b>${v}</b><span>${k==='magic'?'Machine/song-pack specific':k==='platinum'?'Player-family specific':k==='tj'?'TJ catalog specific':k==='kumyoung'?'Kumyoung PH specific':k==='wow'?'WOW Fiesta series specific':'Grand Videoke/TJ series specific'}</span></div>`).join("")}</div><div class="notice">Use “Add / update machine code” on a song after checking the exact printed songbook or companion app for your player model. The saved model appears as a tooltip over the code.</div></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$("qBadge").textContent=state.queue.length?`(${state.queue.length})`:"";$("coins").textContent=state.coins;$("main").innerHTML=tab==="book"?book():tab==="queue"?queueView():guide();wire()}
function wire(){const r=$("main");r.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});const q=$("search");if(q)q.oninput=()=>{query=q.value;render();$("search")?.focus()};$("sort")?.addEventListener('change',e=>{sort=e.target.value;render()});r.querySelector('[data-clear]')?.addEventListener('click',()=>{query="";render()});r.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const c=b.dataset.fav,i=state.favs.indexOf(c);i>=0?state.favs.splice(i,1):state.favs.push(c);save();render()});r.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{pending=b.dataset.res;const s=SONGS.find(x=>x.code===pending);$("qTitle").textContent=`Reserve ${s.title}`;$("singer").value="";$("queueDlg").showModal()});r.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;const s=SONGS.find(x=>x.code===editing);$("cTitle").textContent=`Machine code · ${s.title}`;$("cBrand").value="magic";$("cCode").value="";$("cModel").value="";$("codeDlg").showModal()});r.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.queue.splice(+b.dataset.del,1);save();render()});r.querySelector('[data-clearq]')?.addEventListener('click',()=>{state.queue=[];save();render()})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});$("qCancel").onclick=()=>$("queueDlg").close();$("qAdd").onclick=()=>{const s=SONGS.find(x=>x.code===pending);if(!s)return;state.queue.push({...s,singer:$("singer").value.trim()});save();$("queueDlg").close();toast(`Queued: ${s.title}`);render()};$("cCancel").onclick=()=>$("codeDlg").close();$("cSave").onclick=()=>{const code=$("cCode").value.trim(),model=$("cModel").value.trim(),brand=$("cBrand").value;if(!code||!model){toast("Enter both the code and exact player model.");return}state.codes[editing]??={};state.codes[editing][brand]={code,model,verifiedAt:new Date().toISOString()};save();$("codeDlg").close();toast(`${BRANDS[brand]} code saved`);render()};$("sunoBtn").onclick=()=>window.open("https://suno.com/@millertperez","_blank","noopener");$("coinBtn").onclick=()=>{state.coins++;save();$("coins").textContent=state.coins;toast("Coin inserted — singing is still free!")};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});render();
</script>
</body>
</html>
