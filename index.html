<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VideokePH 🎤 Kanta Na!</title>
<style>
  :root{
    --bg:#0b0518; --bg2:#160b2e; --card:#1d1038; --card2:#251545;
    --neonp:#ff2fb3; --neonc:#22e6ff; --neony:#ffd23f; --neong:#3dff9e;
    --tx:#f3ecff; --dim:#a99cc9; --line:#3a2668;
    --r:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, #35156b 0%, transparent 55%),
               radial-gradient(900px 500px at -10% 30%, #0e3a52 0%, transparent 50%),
               linear-gradient(180deg,var(--bg2),var(--bg) 40%);
    color:var(--tx); min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:40; padding:14px 16px 10px;
    background:linear-gradient(180deg, rgba(11,5,24,.96), rgba(11,5,24,.82));
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .logo h1{
    margin:0; font-size:22px; font-weight:900; letter-spacing:1px;
    background:linear-gradient(90deg,var(--neonc),var(--neonp) 60%,var(--neony));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 24px rgba(255,47,179,.25);
  }
  .logo .sub{font-size:11px; color:var(--dim); letter-spacing:2px; text-transform:uppercase;}
  .coin{
    border:1px solid var(--neony); color:var(--neony); background:rgba(255,210,63,.08);
    border-radius:999px; padding:7px 12px; font-size:13px; font-weight:800; cursor:pointer;
    box-shadow:0 0 12px rgba(255,210,63,.25) inset;
  }
  .coin:active{transform:scale(.93);}
  /* tabs */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex;
    background:rgba(17,8,36,.97); border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(10px);
  }
  nav button{
    flex:1; background:none; border:none; color:var(--dim); font-size:11px; font-weight:700;
    padding:7px 2px; border-radius:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav button .ic{font-size:20px; line-height:1;}
  nav button.on{color:var(--neonc); background:rgba(34,230,255,.08); text-shadow:0 0 12px rgba(34,230,255,.6);}
  main{padding:14px 14px 20px; max-width:760px; margin:0 auto;}
  h2{font-size:16px; margin:16px 2px 10px; color:var(--tx);}
  .muted{color:var(--dim); font-size:13px;}
  /* search + chips */
  .search{
    width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--tx); font-size:15px; outline:none;
  }
  .search:focus{border-color:var(--neonc); box-shadow:0 0 0 3px rgba(34,230,255,.15);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 2px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; font-size:12.5px; font-weight:700;
    border:1px solid var(--line); background:var(--card); color:var(--dim); cursor:pointer; white-space:nowrap;
  }
  .chip.on{border-color:var(--neonp); color:#fff; background:rgba(255,47,179,.18); box-shadow:0 0 12px rgba(255,47,179,.35);}
  /* song rows */
  .song{
    display:flex; align-items:center; gap:11px; padding:11px 12px; margin-bottom:8px;
    background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:var(--r);
  }
  .code{
    font-family:ui-monospace,Menlo,monospace; font-weight:800; font-size:14px; color:var(--neony);
    background:#120a26; border:1px solid #4d3a12; border-radius:9px; padding:7px 8px; letter-spacing:1px;
    text-shadow:0 0 8px rgba(255,210,63,.6); flex:0 0 auto;
  }
  .song .meta{flex:1; min-width:0;}
  .song .t{font-weight:800; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song .a{font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song .b{display:flex; gap:6px; flex:0 0 auto; align-items:center;}
  .fav{background:none;border:none;font-size:19px;cursor:pointer;filter:grayscale(1);opacity:.5;padding:4px;}
  .fav.on{filter:none;opacity:1;text-shadow:0 0 10px rgba(255,210,63,.8);}
  .btn{
    border:none; border-radius:12px; padding:9px 13px; font-size:13px; font-weight:800; cursor:pointer; color:#0b0518;
    background:linear-gradient(90deg,var(--neonc),#6ef7ff);
  }
  .btn.pink{background:linear-gradient(90deg,var(--neonp),#ff7ad1); color:#fff;}
  .btn.ghost{background:var(--card); color:var(--tx); border:1px solid var(--line);}
  .btn.warn{background:#3a1a1a; color:#ff8f8f; border:1px solid #6b2b2b;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.4;}
  /* remote */
  .led{
    font-family:ui-monospace,Menlo,monospace; font-size:44px; letter-spacing:10px; text-align:center;
    color:var(--neong); background:#04120a; border:2px solid #14512f; border-radius:14px; padding:16px 8px;
    text-shadow:0 0 16px rgba(61,255,158,.8); min-height:82px;
  }
  .ledmatch{text-align:center; margin:10px 0 4px; min-height:38px; font-size:14px;}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:340px; margin:14px auto;}
  .pad button{
    font-size:24px; font-weight:800; padding:16px 0; border-radius:16px; cursor:pointer;
    background:linear-gradient(180deg,#2c1a55,#1d1038); color:var(--tx); border:1px solid var(--line);
    box-shadow:0 3px 0 #120a26;
  }
  .pad button:active{transform:translateY(2px); box-shadow:none;}
  .pad .k-clr{color:#ff8f8f;} .pad .k-ok{color:#0b0518; background:linear-gradient(180deg,var(--neong),#19c974); border-color:#0f7a45;}
  /* queue */
  .now{
    border:1px solid var(--neonp); border-radius:18px; padding:16px;
    background:linear-gradient(160deg, rgba(255,47,179,.16), rgba(34,230,255,.07));
    box-shadow:0 0 24px rgba(255,47,179,.18);
  }
  .now .label{font-size:11px; letter-spacing:2px; color:var(--neonp); font-weight:800;}
  .now .t{font-size:21px; font-weight:900; margin:4px 0 2px;}
  .now .a{color:var(--dim); font-size:14px;}
  .now .row{display:flex; gap:8px; margin-top:13px; flex-wrap:wrap;}
  .qitem{display:flex; align-items:center; gap:9px; padding:10px 11px; margin-bottom:7px; background:var(--card); border:1px solid var(--line); border-radius:14px;}
  .qitem .n{font-weight:900; color:var(--neonc); width:22px; text-align:center;}
  .qitem .meta{flex:1; min-width:0;}
  .qitem .t{font-weight:700; font-size:14px;}
  .qitem .a{font-size:12px; color:var(--dim);}
  .mini{background:var(--card2); border:1px solid var(--line); color:var(--dim); border-radius:9px; padding:6px 8px; font-size:13px; cursor:pointer;}
  /* perform overlay */
  .overlay{position:fixed; inset:0; z-index:100; background:rgba(6,2,15,.97); display:none; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center;}
  .overlay.open{display:flex;}
  .ovt{font-size:26px; font-weight:900; margin:6px 0;}
  .ova{color:var(--dim); margin-bottom:8px;}
  .timer{font-family:ui-monospace,monospace; font-size:52px; font-weight:800; color:var(--neonc); text-shadow:0 0 20px rgba(34,230,255,.6); margin:10px 0;}
  .meterwrap{width:min(340px,80vw); height:16px; border-radius:99px; background:#150c2c; border:1px solid var(--line); overflow:hidden; margin:6px auto 4px;}
  .meter{height:100%; width:0%; background:linear-gradient(90deg,var(--neong),var(--neony),var(--neonp)); transition:width .1s;}
  .scorebig{
    font-size:96px; font-weight:900; line-height:1;
    background:linear-gradient(180deg,var(--neony),var(--neonp));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(255,210,63,.35); margin:8px 0;
  }
  .verdict{font-size:20px; font-weight:800; color:var(--neonc); margin-bottom:14px;}
  /* leaderboard */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--line);}
  th{color:var(--dim); font-size:11px; letter-spacing:1px; text-transform:uppercase;}
  td.sc{font-weight:900; color:var(--neony);}
  .medal{font-size:16px;}
  .empty{padding:34px 14px; text-align:center; color:var(--dim); border:1px dashed var(--line); border-radius:16px; margin-top:10px;}
  .rowbtns{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  dialog{
    border:1px solid var(--line); border-radius:18px; background:var(--card2); color:var(--tx);
    width:min(430px,92vw); padding:18px;
  }
  dialog::backdrop{background:rgba(4,1,12,.7); backdrop-filter:blur(3px);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--dim); margin-bottom:5px; font-weight:700;}
  .field input{width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line); background:var(--card); color:var(--tx); font-size:15px;}
  .singers{display:flex; gap:7px; flex-wrap:wrap; margin-top:7px;}
  .confetti{position:fixed; top:-14px; z-index:120; font-size:20px; animation:fall linear forwards; pointer-events:none;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.6;}}
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom)); z-index:90;
    background:#241448; border:1px solid var(--neonc); color:var(--tx); padding:10px 16px; border-radius:12px;
    font-size:13.5px; font-weight:700; box-shadow:0 0 18px rgba(34,230,255,.3); opacity:0; transition:opacity .25s; pointer-events:none;
    max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1;}
  .pill{font-size:10.5px; padding:2px 7px; border-radius:99px; border:1px solid var(--line); color:var(--dim); margin-left:5px; vertical-align:1px;}
</style>
</head>

<header>
  <div class="logo">
    <div>
      <h1>VIDEOKE ★ PH</h1>

  </div>
</header>

    <button class="btn pink" id="pvStop">⏹ Finish &amp; Get Score</button>
    <button class="btn warn" id="pvCancel">✖ Cancel</button>
  </div>
</div>

<div class="overlay" id="scoreOv">
  <div class="muted" style="letter-spacing:2px;">YOUR SCORE</div>
  <div class="scorebig" id="scNum">0</div>
  <div class="verdict" id="scVerdict"></div>
  <div class="ova" id="scWho"></div>
  <div class="rowbtns" style="justify-content:center;">
    <button class="btn" id="scNext">⏭ Next Singer</button>
    <button class="btn ghost" id="scClose">Close</button>
  </div>
</div>

<dialog id="reserveDlg">
  <h2 style="margin-top:0;">🎤 Reserve: <span id="rdTitle"></span></h2>
  <div class="field">
    <label>Who's singing? (optional)</label>

    <div class="singers" id="rdRecent"></div>
  </div>
  <div class="rowbtns" style="justify-content:flex-end;">
    <button class="btn ghost" id="rdCancel">Cancel</button>
    <button class="btn pink" id="rdOk">Reserve 🎶</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

function normalize(d){
  d=d&&typeof d==="object"?d:{};
  d.queue=Array.isArray(d.queue)?d.queue:[];
  d.history=Array.isArray(d.history)?d.history:[];
  d.favs=Array.isArray(d.favs)?d.favs:[];
  d.singers=Array.isArray(d.singers)?d.singers:[];
  d.coins=Number.isFinite(d.coins)?d.coins:0;
  return d;
}
let S;
try{S=normalize(JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){S=normalize({});}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}

let tab="book", filterCat="all", query="", padCode="";
const byCode=Object.fromEntries(SONGS.map(s=>[s.code,s]));
const $=id=>document.getElementById(id);
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2200);}
function ytUrl(s){return "https://www.youtube.com/results?search_query="+encodeURIComponent(s.title+" "+s.artist+" karaoke");}

/* ------------------------ AUDIO FX ------------------------ */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC;}
function beep(f,t0,dur,type,vol){
  const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=type||"square";o.frequency.value=f;
  g.gain.setValueAtTime(vol||.12,c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);
  o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.02);
}
function coinSfx(){beep(988,0,.09,"square",.1);beep(1319,.09,.22,"square",.1);}
function fanfare(score){
  const seq=score>=95?[523,659,784,1047,1319,1568]:score>=85?[523,659,784,1047]:[392,523,659];
  seq.forEach((f,i)=>beep(f,i*.14,.28,"triangle",.16));
  if(score>=95)seq.forEach((f,i)=>beep(f*2,.9+i*.07,.18,"sine",.08));
}

/* ------------------------ RENDER ------------------------ */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  $("qBadge").textContent=S.queue.length?("("+S.queue.length+")"):"";
  $("coinCt").textContent=S.coins;
  const m=$("main");
  if(tab==="book")m.innerHTML=viewBook();
  else if(tab==="remote")m.innerHTML=viewRemote();
  else if(tab==="queue")m.innerHTML=viewQueue();
  else m.innerHTML=viewCharts();
  wire(m);
}
function songRow(s){
  const fav=S.favs.includes(s.code);
  return `<div class="song">
    <div class="code">${esc(s.code)}</div>
    <div class="meta">
      <div class="t">${esc(s.title)}</div>
      <div class="a">${esc(s.artist)} · ${esc(s.year)}</div>
    </div>
    <div class="b">
      <button class="fav ${fav?"on":""}" data-fav="${esc(s.code)}" title="Favorite">⭐</button>
      <button class="btn pink" data-res="${esc(s.code)}">Reserve</button>
    </div>
  </div>`;
}
function viewBook(){
  const q=query.trim().toLowerCase();
  let list=SONGS.filter(s=>{
    if(filterCat==="fav"&&!S.favs.includes(s.code))return false;
    if(filterCat!=="all"&&filterCat!=="fav"&&s.cat!==filterCat)return false;
    if(q&&!(s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q)||s.code.includes(q)))return false;
    return true;
  });
  const chips=Object.entries(CATS).map(([k,v])=>`<button class="chip ${filterCat===k?"on":""}" data-cat="${k}">${v}</button>`).join("");
  return `<input class="search" id="q" placeholder="🔍 Search title, artist, or code…" value="${esc(query)}">
    <div class="chips">${chips}</div>
    <div class="muted" style="margin:2px 2px 10px;">${list.length} song${list.length===1?"":"s"} · tap Reserve to add to queue</div>
    ${list.map(songRow).join("")||`<div class="empty">Walang nahanap 😅<br>Try another keyword.</div>`}`;
}
function viewRemote(){
  const s=byCode[padCode];
  const match=padCode.length?(s?`<span style="color:var(--neong);font-weight:800;">${esc(s.title)}</span><br><span class="muted">${esc(s.artist)}</span>`:`<span class="muted">${padCode.length>=5?"Invalid code — try again 🙈":"Keep typing…"}</span>`):`<span class="muted">Enter a 5-digit song code, parang totoong videoke!</span>`;
  return `<h2>🎛️ Videoke Remote</h2>
    <div class="led">${esc(padCode.padEnd(5,"·"))}</div>
    <div class="ledmatch">${match}</div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pad="${n}">${n}</button>`).join("")}
      <button class="k-clr" data-padclr="1">CLR</button>
      <button data-pad="0">0</button>
      <button class="k-ok" data-padok="1">⏎</button>
    </div>
    <div class="muted" style="text-align:center;">Codes are in the Songbook 📖 — e.g. <b>12001</b> = Anak</div>`;
}
function viewQueue(){
  const now=S.queue[0];
  let h=`<h2>🎤 Singing Queue</h2>`;
  if(!now)return h+`<div class="empty">Queue is empty!<br>Reserve songs from the Songbook 📖 or punch a code on the Remote 🎛️</div>`;
  h+=`<div class="now">
    <div class="label">NOW PLAYING</div>
    <div class="t">${esc(now.title)}</div>
    <div class="a">${esc(now.artist)}${now.singer?` · 🎙 <b style="color:var(--neony)">${esc(now.singer)}</b>`:""}</div>
    <div class="row">
      <button class="btn pink" data-sing="1">🎤 Sing! (with scoring)</button>
      <button class="btn ghost" data-yt="${esc(now.code)}">▶ YouTube karaoke</button>
      <button class="btn ghost" data-skip="1">⏭ Skip</button>
    </div>
  </div>
  <h2 style="margin-top:18px;">Up Next</h2>`;
  const rest=S.queue.slice(1);
  h+=rest.length?rest.map((it,i)=>`<div class="qitem">
      <div class="n">${i+1}</div>
      <div class="meta"><div class="t">${esc(it.title)}</div><div class="a">${esc(it.artist)}${it.singer?" · 🎙 "+esc(it.singer):""}</div></div>
      <button class="mini" data-up="${i+1}" ${i===0?"disabled":""}>↑</button>
      <button class="mini" data-del="${i+1}">✕</button>
    </div>`).join(""):`<div class="muted" style="padding:6px 2px;">No one else in line — solo concert! 🎶</div>`;
  h+=`<div class="rowbtns" style="margin-top:14px;"><button class="btn warn" data-clearq="1">Clear queue</button></div>`;
  return h;
}
function viewCharts(){
  const hist=S.history;
  let h=`<h2>🏆 Hall of Fame</h2>`;
  if(!hist.length)return h+`<div class="empty">No performances yet.<br>Sing your first song to enter the charts! 🌟</div>`;
  const best={};
  hist.forEach(p=>{const k=p.singer||"Anonymous";if(!best[k]||p.score>best[k].score)best[k]=p;});
  const top=Object.entries(best).sort((a,b)=>b[1].score-a[1].score).slice(0,10);
  const medals=["🥇","🥈","🥉"];
  h+=`<table><tr><th></th><th>Singer</th><th>Best song</th><th>Score</th></tr>
    ${top.map(([name,p],i)=>`<tr><td class="medal">${medals[i]||(i+1)}</td><td><b>${esc(name)}</b></td><td>${esc(p.title)}</td><td class="sc">${p.score}</td></tr>`).join("")}
  </table>
  <h2 style="margin-top:20px;">Recent Performances</h2>
  ${hist.slice(-12).reverse().map(p=>`<div class="qitem">
    <div class="meta"><div class="t">${esc(p.title)} <span class="pill">${esc(p.artist)}</span></div>
    <div class="a">🎙 ${esc(p.singer||"Anonymous")} · ${new Date(p.at).toLocaleString()}</div></div>
    <div class="sc" style="font-weight:900;color:var(--neony);font-size:19px;">${p.score}</div>
  </div>`).join("")}
  <div class="rowbtns" style="margin-top:14px;">
    <button class="btn ghost" data-export="1">⬇ Export data</button>
    <button class="btn ghost" data-import="1">⬆ Import</button>
    <button class="btn warn" data-reset="1">Reset everything</button>
  </div>
  <input type="file" id="impFile" accept=".json" style="display:none;">`;
  return h;
}

/* ------------------------ RESERVE FLOW ------------------------ */
let pendingCode=null;
function openReserve(code){
  const s=byCode[code];if(!s)return;
  pendingCode=code;
  $("rdTitle").textContent=s.title;
  $("rdSinger").value="";
  $("rdRecent").innerHTML=S.singers.slice(0,6).map(n=>`<button class="chip" data-quick="${esc(n)}">${esc(n)}</button>`).join("");
  $("rdRecent").querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{$("rdSinger").value=b.dataset.quick;});
  $("reserveDlg").showModal();
}
function doReserve(){
  const s=byCode[pendingCode];if(!s)return;
  const singer=$("rdSinger").value.trim();
  if(singer&&!S.singers.includes(singer)){S.singers.unshift(singer);S.singers=S.singers.slice(0,12);}
  S.queue.push({code:s.code,title:s.title,artist:s.artist,singer});
  S.coins=Math.max(0,S.coins-0); // coins are just for fun, never gate
  save();$("reserveDlg").close();
  toast(`🎶 Reserved: ${s.title}${singer?" — "+singer:""} (#${S.queue.length} in queue)`);
  padCode="";render();
}

/* ------------------------ PERFORMANCE & SCORING ------------------------ */
let perf=null; // {stream,analyser,raf,t0,timerIv,frames,active}
function startPerf(){
  const now=S.queue[0];if(!now)return;
  $("pvTitle").textContent=now.title;
  $("pvArtist").textContent=now.artist+" · "+(byCode[now.code]?byCode[now.code].year:"");
  $("pvSinger").textContent=now.singer?("🎙 "+now.singer):"";
  $("pvTimer").textContent="0:00";
  $("pvMeter").style.width="0%";
  $("perfOv").classList.add("open");
  perf={t0:Date.now(),frames:0,active:0,stream:null,analyser:null,raf:0,timerIv:0};
  perf.timerIv=setInterval(()=>{
    const s=Math.floor((Date.now()-perf.t0)/1000);
    $("pvTimer").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  },500);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      if(!perf){stream.getTracks().forEach(t=>t.stop());return;}
      perf.stream=stream;
      const c=ac(),src=c.createMediaStreamSource(stream),an=c.createAnalyser();
      an.fftSize=512;src.connect(an);perf.analyser=an;
      $("pvMicNote").textContent="🎙 Mic on — kanta lang nang malakas para tumaas ang score!";
      const buf=new Uint8Array(an.fftSize);
      const loop=()=>{
        if(!perf||!perf.analyser)return;
        an.getByteTimeDomainData(buf);
        let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v;}
        const rms=Math.sqrt(sum/buf.length);
        perf.frames++;if(rms>.035)perf.active++;
        $("pvMeter").style.width=Math.min(100,rms*750)+"%";
        perf.raf=requestAnimationFrame(loop);
      };
      loop();
    }).catch(()=>{$("pvMicNote").textContent="Mic not available — judge's discretion scoring 😄";});
  }else{$("pvMicNote").textContent="Mic not available — judge's discretion scoring 😄";}
}
function stopPerfHardware(){
  if(!perf)return;
  clearInterval(perf.timerIv);cancelAnimationFrame(perf.raf);
  if(perf.stream)perf.stream.getTracks().forEach(t=>t.stop());
}
function finishPerf(cancelled){
  if(!perf)return;
  stopPerfHardware();
  $("perfOv").classList.remove("open");
  const now=S.queue[0];
  if(cancelled||!now){perf=null;render();return;}
  const secs=(Date.now()-perf.t0)/1000;
  let score;
  if(perf.analyser&&perf.frames>30){
    const ratio=perf.active/perf.frames;           // how much of the song you actually sang
    score=Math.round(76+ratio*22+Math.random()*4); // 76–100ish, generous like a real videoke
  }else{
    score=Math.round(80+Math.random()*19);         // judge's discretion 80–99
  }
  if(secs<8)score=Math.min(score,74);              // sinayang mo lang 😅
  score=Math.max(60,Math.min(100,score));
  const perfRec={code:now.code,title:now.title,artist:now.artist,singer:now.singer||"",score,at:Date.now()};
  S.history.push(perfRec);
  S.queue.shift();
  save();perf=null;
  showScore(perfRec);
}
const VERDICTS=[
 [100,"💯 PERFECT! GRAND VIDEOKE STAR!"],
 [95,"🌟 Superstar! Parang concert!"],
 [90,"🔥 Sobrang galing! Encore! Encore!"],
 [85,"👏 Ang galing mo, idol!"],
 [80,"😊 Solid performance, kapatid!"],
 [70,"😅 Practice pa konti… pero pwede na!"],
 [0,"🤭 Kanta pa ulit — libre naman!"],
];
function showScore(p){
  $("scNum").textContent=p.score;
  $("scVerdict").textContent=VERDICTS.find(v=>p.score>=v[0])[1];
  $("scWho").textContent=(p.singer?p.singer+" · ":"")+p.title;
  $("scoreOv").classList.add("open");
  fanfare(p.score);
  confetti(p.score>=90?46:18);
  render();
}
function confetti(n){
  const em=["🎉","✨","🎊","⭐","💖","🎵"];
  for(let i=0;i<n;i++){
    const d=document.createElement("div");
    d.className="confetti";d.textContent=em[i%em.length];
    d.style.left=Math.random()*100+"vw";
    d.style.animationDuration=(2.2+Math.random()*2.2)+"s";
    d.style.animationDelay=(Math.random()*.7)+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),5200);
  }
}

/* ------------------------ EVENTS ------------------------ */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0);});
$("coinBtn").onclick=()=>{S.coins++;save();$("coinCt").textContent=S.coins;coinSfx();if(S.coins===1)toast("🪙 Coin inserted! (Libre lang dito, promise)");};
$("rdCancel").onclick=()=>$("reserveDlg").close();
$("rdOk").onclick=doReserve;
$("pvStop").onclick=()=>finishPerf(false);
$("pvCancel").onclick=()=>finishPerf(true);
$("pvYt").onclick=()=>{const n=S.queue[0];if(n)window.open(ytUrl(n),"_blank","noopener");};
$("scNext").onclick=()=>{$("scoreOv").classList.remove("open");tab="queue";render();};
$("scClose").onclick=()=>{$("scoreOv").classList.remove("open");};

function wire(root){
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filterCat=b.dataset.cat;render();});
  const q=root.querySelector("#q");
  if(q){q.oninput=()=>{query=q.value;render();const nq=$("main").querySelector("#q");nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length);};}
  root.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>openReserve(b.dataset.res));
  root.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.fav,i=S.favs.indexOf(c);
    if(i>=0)S.favs.splice(i,1);else S.favs.push(c);
    save();render();
  });
  root.querySelectorAll("[data-pad]").forEach(b=>b.onclick=()=>{
    if(padCode.length<5){padCode+=b.dataset.pad;beep(660,0,.05,"square",.06);}
    render();
  });
  root.querySelectorAll("[data-padclr]").forEach(b=>b.onclick=()=>{padCode="";beep(330,0,.07,"square",.06);render();});
  root.querySelectorAll("[data-padok]").forEach(b=>b.onclick=()=>{
    const s=byCode[padCode];
    if(s){beep(880,0,.1,"square",.08);openReserve(padCode);}
    else{beep(220,0,.18,"sawtooth",.08);toast("❌ Invalid code — check the Songbook!");}
  });
  root.querySelectorAll("[data-sing]").forEach(b=>b.onclick=()=>startPerf());
  root.querySelectorAll("[data-yt]").forEach(b=>b.onclick=()=>{const s=byCode[b.dataset.yt];if(s)window.open(ytUrl(s),"_blank","noopener");});
  root.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>{const it=S.queue.shift();save();toast("⏭ Skipped: "+(it?it.title:""));render();});
  root.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.up;
    if(i>1){[S.queue[i-1],S.queue[i]]=[S.queue[i],S.queue[i-1]];save();render();}
  });
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.queue.splice(+b.dataset.del,1);save();render();});
  root.querySelectorAll("[data-clearq]").forEach(b=>b.onclick=()=>{if(confirm("Clear the whole queue?")){S.queue=[];save();render();}});
  root.querySelectorAll("[data-export]").forEach(b=>b.onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="videokeph-data.json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  });
  root.querySelectorAll("[data-import]").forEach(b=>b.onclick=()=>root.querySelector("#impFile").click());
  const f=root.querySelector("#impFile");
  if(f)f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{try{S=normalize(JSON.parse(r.result));save();render();toast("✅ Data imported!");}catch(e){toast("❌ Invalid file");}};
    r.readAsText(file);
  };
  root.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{
    if(confirm("Reset ALL data (queue, favorites, scores)?")){S=normalize({});save();render();toast("🧹 Fresh start!");}
  });
}
render();
</script>
